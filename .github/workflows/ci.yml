name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validator
        run: python -m pip install .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check Skill consistency
        run: python scripts/check_skill_consistency.py
      - name: Strictly validate public examples
        run: |
          relationship-case --strict examples/cases/synthetic-conflict-valid.json
          relationship-case --strict examples/cases/synthetic-safety-valid.json
