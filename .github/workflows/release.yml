name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test release candidate
        run: |
          python -m unittest discover -s tests -v
          python scripts/check_skill_consistency.py
      - name: Build validator package
        run: |
          python -m pip install build
          python -m build
      - name: Package standalone Skill
        run: |
          cd .agents/skills
          python -m zipfile -c ../../dist/analyze-romantic-relationships-skill.zip analyze-romantic-relationships
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
